    </div>

    <button id="nav-toggle" class="p-2 mc-nav-toggle" aria-label="Open menu" aria-expanded="false">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />

    </button>

    <nav id="desktop-nav" class="hidden md:flex items-center gap-6 text-lg md:text-xl font-semibold text-[#e9d8c8] whitespace-nowrap">

      <a href="members.html"  class="px-3 py-2 hover:bg-[#8b4a2f]/30 rounded-lg">Members</a>
      <a href="artists.html"  class="px-3 py-2 hover:bg-[#8b4a2f]/30 rounded-lg">Artists We Cover</a>

      <a href="schedule.html" class="px-3 py-2 hover:bg-[#8b4a2f]/30 rounded-lg">Schedule</a>
      <a href="contact.html"  class="px-5 py-2 bg-[#8b4a2f]/40 rounded-xl text-[#f7eadb]">Contact</a>
    </nav>

  </div>

  <div id="mobile-nav" class="md:hidden hidden mc-mobile-nav">
    <div class="mc-nav-inner">
      <div class="px-2 py-1 flex flex-col gap-2">
      <a href="index.html"    class="py-2 px-3 rounded hover:bg-[#8b4a2f]/30 text-[#f7eadb]">Home</a>
      <a href="members.html"  class="py-2 px-3 rounded hover:bg-[#8b4a2f]/30 text-[#f7eadb]">Members</a>
      <a href="artists.html"  class="py-2 px-3 rounded hover:bg-[#8b4a2f]/30 text-[#f7eadb]">Artists We Cover</a>
      <a href="videos.html"   class="py-2 px-3 rounded hover:bg-[#8b4a2f]/30 text-[#f7eadb]">Videos</a>
      <a href="photos.html"   class="py-2 px-3 rounded hover:bg-[#8b4a2f]/30 text-[#f7eadb]">Photos</a>
      <a href="schedule.html" class="py-2 px-3 rounded hover:bg-[#8b4a2f]/30 text-[#f7eadb]">Schedule</a>
      <a href="contact.html"  class="py-2 px-3 rounded bg-[#8b4a2f]/40 text-[#f7eadb]">Contact</a>
      </div>
    </div>
  </div>
</header>

<!-- CONTENT -->
<main class="pt-48 pb-20 backdrop-blur-sm bg-[#4b3223]/10 flex-1 text-center">

  <h1 class="text-5xl font-extrabold text-[#f7eadb] mb-10 tracking-wide">
    Photo Gallery
  </h1>
  <!-- Galleries list (populated by JS from /content/photos/index.json) -->
  <div class="galleries">
    <div id="gallery-covers" class="gallery-covers" aria-live="polite">
      <!-- JS injects year covers here -->
    </div>
  </div>

  <!-- Year gallery overlay -->
  <div id="gallery-overlay" class="gallery-overlay" role="dialog" aria-hidden="true">
    <div class="gallery-panel" role="document">
      <button id="panel-close" class="panel-close">Close</button>
      <h2 id="gallery-title">Gallery</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="nav prev" id="light-prev" type="button" aria-label="Previous photo">‹</button>
    <img id="light-img" src="" alt="">
    <button class="nav next" id="light-next" type="button" aria-label="Next photo">›</button>
    <button class="close" id="light-close" type="button" aria-label="Close lightbox">✕</button>
  </div>

  <script>
    (function(){
      const coversEl = document.getElementById('gallery-covers');
      const overlay = document.getElementById('gallery-overlay');
      const panelClose = document.getElementById('panel-close');
      const grid = document.getElementById('gallery-grid');
      const galleryTitle = document.getElementById('gallery-title');
      const lightbox = document.getElementById('lightbox');
      const lightImg = document.getElementById('light-img');
      const lightPrev = document.getElementById('light-prev');
      const lightNext = document.getElementById('light-next');
      const lightClose = document.getElementById('light-close');

      let currentImages = [];
      let currentIndex = 0;

      // central image display (wrap-around)
      function showImage(index){
        if(!currentImages || !currentImages.length){
          console.log('showImage: no images', currentImages && currentImages.length);
          return;
        }
        currentIndex = ((index % currentImages.length) + currentImages.length) % currentImages.length;
        console.log('showImage ->', currentIndex, 'of', currentImages.length);
        // log a short preview of the first few entries for debugging
        try{ console.log('images preview', currentImages.slice(0,6)); }catch(e){}
        lightImg.src = currentImages[currentIndex];
        lightImg.setAttribute('data-index', currentIndex);
        // ensure image isn't draggable to avoid accidental behavior
        lightImg.draggable = false;
      }

      function openLightbox(index){
        showImage(index);
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden','false');
        document.body.classList.add('lightbox-open');
      }

      function closeLightbox(){
        console.log('closeLightbox');
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden','true');
        document.body.classList.remove('lightbox-open');
      }

      function openLightboxBySrc(src){
        currentImages = src ? [src] : [];
        openLightbox(0);
      }

      function prevImage(){ console.log('prevImage'); if(currentImages.length){ showImage(currentIndex - 1); } }
      function nextImage(){ console.log('nextImage'); if(currentImages.length){ showImage(currentIndex + 1); } }

      // make sure clicks on the nav buttons don't bubble and work on touch devices
      function bindNav(el, handler){
        if(!el) return;
        function wrapped(e){ e.stopPropagation(); try{ e.preventDefault(); }catch(err){} handler(); console.log('nav fired', el && el.id); }
        el.addEventListener('click', wrapped, false);
        el.addEventListener('touchend', wrapped, false);
      }
      bindNav(lightPrev, prevImage);
      bindNav(lightNext, nextImage);
      bindNav(lightClose, closeLightbox);

      // clicking on backdrop closes lightbox
      lightbox.addEventListener('click', function(e){ if(e.target===lightbox) closeLightbox(); });

      // keyboard navigation: left/right/esc
      document.addEventListener('keydown', function(e){
        if(!lightbox.classList.contains('open')) return;
        if(e.key === 'ArrowLeft') { e.preventDefault(); prevImage(); }
        else if(e.key === 'ArrowRight') { e.preventDefault(); nextImage(); }
        else if(e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
      });

      // Touch swipe handling for mobile inside the lightbox
      (function(){
        let startX = 0, startY = 0, dx = 0, dy = 0, isMoving = false;
        const threshold = 40; // px

        function onTouchStart(e){
          if(!lightbox.classList.contains('open')) return;
          const t = e.touches && e.touches[0];
          if(!t) return;
          startX = t.clientX; startY = t.clientY; dx = 0; dy = 0; isMoving = true;
        }
        function onTouchMove(e){
          if(!isMoving) return;
          const t = e.touches && e.touches[0];
          if(!t) return;
          dx = t.clientX - startX; dy = t.clientY - startY;
          // if horizontal movement, prevent vertical scroll
          if(Math.abs(dx) > Math.abs(dy)){
            try{ e.preventDefault(); }catch(err){}
          }
        }
        function onTouchEnd(e){
          if(!isMoving) return; isMoving = false;
          if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > threshold){
            if(dx < 0){ // swipe left => next
              nextImage();
            } else { // swipe right => prev
              prevImage();
            }
          }
          dx = dy = 0;
        }

        lightbox.addEventListener('touchstart', onTouchStart, {passive:false});
        lightbox.addEventListener('touchmove', onTouchMove, {passive:false});
        lightbox.addEventListener('touchend', onTouchEnd, {passive:false});
      })();

      panelClose.addEventListener('click', function(){ overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); });

      function renderCovers(data){
        // sort by year desc
        data.galleries = data.galleries || [];
        data.galleries.sort((a,b)=> (b.year||'').localeCompare(a.year||'', undefined, {numeric:true}));
        data.galleries.forEach(function(gallery, idx){
          const div = document.createElement('div');
          div.className = 'gallery-cover';
          const img = document.createElement('img');
          img.src = gallery.cover || '';
          img.alt = gallery.year + ' cover';
          const label = document.createElement('div');
          label.className = 'year-label';
          label.textContent = gallery.year || '';
          div.appendChild(img);
          div.appendChild(label);
          div.addEventListener('click', function(){
            // If gallery contains explicit images, open the gallery panel; otherwise open the cover directly in the lightbox
            if(Array.isArray(gallery.images) && gallery.images.length){
              openGallery(gallery);
            } else if(gallery.cover){
              openLightboxBySrc(gallery.cover);
            } else {
              openGallery(gallery);
            }
          });
          coversEl.appendChild(div);
        });
      }

      function openGallery(gallery){
        // normalize image entries: accept string paths or objects with common keys
        currentImages = (gallery.images||[]).map(function(i){
          if(typeof i === 'string') return i;
          if(!i || typeof i !== 'object') return '';
          return i.image || i.src || i.path || i.url || '';
        }).filter(Boolean);
        galleryTitle.textContent = (gallery.year || 'Gallery');
        grid.innerHTML = '';
        currentImages.forEach(function(src, i){
          const c = document.createElement('div'); c.className='card';
          const im = document.createElement('img'); im.src = src; im.alt = gallery.year + ' photo '+(i+1);
          im.addEventListener('click', function(){ openLightbox(i); });
          c.appendChild(im); grid.appendChild(c);
        });
        overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false');
      }

      // fetch the index JSON
      fetch('/content/photos/index.json').then(r=>{
        if(!r.ok) throw new Error('index not found');
        return r.json();
      }).then(data=>{
        renderCovers(data);
      }).catch(err=>{
        coversEl.innerHTML = '<p style="color:#fff">No photo galleries found.</p>';
        console.error(err);
      });
    })();
  </script>

</main>

<footer class="w-full bg-[#4b3223] text-center py-6 mt-auto">

  </p>

<script src="nav.js"></script>
<script>
  // Prevent navigation to Netlify CMS from the photos page (defensive)
  (function(){
    try{
      document.addEventListener('click', function(e){
        var a = e.target.closest && e.target.closest('a');
        if(!a) return;
        try{
          if(a.href && a.href.indexOf('/admin') !== -1){
            e.preventDefault();
            e.stopPropagation();
            // optionally show a brief message
            console.log('Blocked navigation to CMS from photos page');
          }
        }catch(err){}
      }, true);
    }catch(err){}
  })();
</script>

</body>
</html>
