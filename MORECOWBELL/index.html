  <link rel="stylesheet" href="nav.css">
    <script>
    // If Identity confirmation / invite token lands on the site root,
    // forward the user to /admin/ preserving querystring or hash so Netlify CMS can complete the flow.
    (function() {
      try {
        var q = window.location.search || '';
        var h = window.location.hash || '';
        var p = window.location.pathname || '';
        // Detect token in query or fragment (hash) or identity confirm path
        var hasToken = /token|confirmation|invite/i.test(q + h) || /identity\/confirm|identity\/invite/i.test(p);
        if (hasToken) {
          var target = '/admin/' + q + h;
          if (!p.startsWith('/admin')) {
            // use replace so back button doesn't loop
            window.location.replace(target);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
